[project]
name = "proyecto-final"
version = "0.1.0"
description = ""
authors = [
    {name = "Alberto"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.29,<0.0.30)",
    "bcrypt (>=4.0.1,<5.0.0)",
    "typer (>=0.25.1,<0.26.0)",
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)"
]

[tool.poetry]
packages = [{include = "proyecto_final", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.1.0,<3.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "hypothesis (>=6.152.7,<7.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "types-passlib (>=1.7.7.20260211,<2.0.0.0)",
    "types-requests (>=2.33.0.20260518,<3.0.0.0)",
    "pip-audit (>=2.10.0,<3.0.0)",
    "safety (>=3.7.0,<4.0.0)"
]

[tool.mypy]
exclude = [
    "alembic",
]

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79

[tool.poetry.scripts]
orders-cli = "proyecto_final.cli.main:app"