name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:

  ci:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run lint
        run: poetry run ruff check .

      - name: Run type-check
        run: poetry run mypy src

      - name: Run tests
        run: poetry run pytest

      - name: Build package
        run: poetry build

      - name: Build Docker image
        run: docker build -t test-intermediate-lvl .