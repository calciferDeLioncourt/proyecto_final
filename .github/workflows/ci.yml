name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:

  ci:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run lint
        run: poetry run ruff check .

      - name: Run type-check
        run: poetry run mypy src

      - name: Run tests
        run: poetry run pytest

      - name: Build package
        run: poetry build

      - name: Build Docker image
        run: docker build -t proyecto_final .

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag proyecto_final ${{ secrets.DOCKER_USERNAME }}/proyecto_final:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/proyecto_final:latest